<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7f0">
  <title>MoriShiba 🧡</title>
  <meta name="description" content="Все ссылки MoriShiba в одном месте!">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #4b342b;
      background:
        radial-gradient(circle at 15% 15%, #ffe1c7 0, transparent 30%),
        radial-gradient(circle at 90% 80%, #ffd8d9 0, transparent 30%),
        #fff7f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: appear 0.8s ease;
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      background: linear-gradient(135deg, #ffd5b2, #ffb8a9);
      box-shadow: 0 8px 25px #b56d4925;
      border: 4px solid #fff;
    }

    h1 {
      font-size: clamp(30px, 8vw, 40px);
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #98796a;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #53382c;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #f4dfd2;
      box-shadow: 0 4px 12px #75452a08;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s,
                  background 0.2s;
    }

    .link:hover {
      transform: translateY(-3px);
      background: #fff;
      box-shadow: 0 9px 22px #75452a18;
    }

    .emoji {
      font-size: 22px;
    }

    .link:focus-visible {
      outline: 3px solid #e99c75;
      outline-offset: 3px;
    }

    footer {
      margin-top: 26px;
      font-size: 12px;
      color: #b19688;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="avatar" aria-label="Сиба-ину">🐕</div>

    <h1>MoriShiba 🧡</h1>
    <p class="subtitle">
      Добро пожаловать в мой уголок интернета! ✨<br>
      Все мои ссылки собраны здесь.
    </p>

    <nav class="links" aria-label="Мои ссылки">
      <a class="link" href="https://www.twitch.tv/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🎮</span> Twitch
      </a>

      <a class="link" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🎵</span> TikTok
      </a>

      <a class="link" href="https://discord.com/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">💬</span> Discord
      </a>

      <a class="link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">▶️</span> YouTube
      </a>

      <a class="link" href="https://boosty.to/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">🧡</span> Boosty
      </a>

      <a class="link" href="https://t.me/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">✈️</span> Telegram
      </a>

      <a class="link" href="https://github.com/" target="_blank" rel="noopener noreferrer">
        <span class="emoji">💻</span> GitHub
      </a>

      <a class="link" href="mailto:hello@example.com">
        <span class="emoji">✉️</span> Связаться со мной
      </a>
    </nav>

    <footer>
      Made with 🧡 by MoriShiba
    </footer>
  </main>
</body>
</html>
